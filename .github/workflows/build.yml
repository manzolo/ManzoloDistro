name: Build & Publish OCI Image

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'Containerfile.arch'
      - 'build.sh'
      - 'build.arch.sh'
      - 'config/**'
      - '.github/workflows/build.yml'

  # Rebuild automatico settimanale (ogni lunedì alle 05:00 ora italiana / 04:00 UTC)
  schedule:
    - cron: '0 4 * * 1'

  # Permette il trigger manuale dalla UI di GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: variante Ubuntu ───────────────────────────────────
  build-ubuntu:
    name: Build Ubuntu image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (Ubuntu)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/manzolodistro
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (Ubuntu)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ubuntu
          cache-to: type=gha,mode=max,scope=ubuntu
          platforms: linux/amd64,linux/arm64

      - name: Image digest summary (Ubuntu)
        run: |
          echo "### ✅ Ubuntu image pubblicata!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/manzolodistro:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── Job 2: variante Arch Linux ───────────────────────────────
  build-arch:
    name: Build Arch Linux image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (Arch)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/manzolodistro-arch
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (Arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile.arch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arch
          cache-to: type=gha,mode=max,scope=arch
          # Arch Linux ha pacchetti solo per amd64 (x86_64)
          platforms: linux/amd64

      - name: Image digest summary (Arch)
        run: |
          echo "### ✅ Arch Linux image pubblicata!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/manzolodistro-arch:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── Job 3: smoke test sulle immagini appena pushate ──────────
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-arch]

    permissions:
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SHA tag
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Smoke test – Ubuntu
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/manzolodistro:${{ steps.sha.outputs.tag }}"
          run() { docker run --rm "$IMAGE" "$@"; }

          echo "── Shell & CLI ──────────────────────────────"
          run zsh --version
          run fzf --version
          run rg --version
          run jq --version
          run yq --version

          echo "── Sviluppo ─────────────────────────────────"
          run git --version
          run git config --system --list | grep "alias.co"
          run gh --version
          run python3 --version
          run node --version

          echo "── Docker CLI ───────────────────────────────"
          run docker --version

          echo "── Desktop ──────────────────────────────────"
          run niri --version
          run fuzzel --version
          run brightnessctl --version
          run playerctl --version

          echo "── Media ────────────────────────────────────"
          run ffmpeg -version 2>&1 | head -1

          echo "✅ Smoke test Ubuntu superato!"

      - name: Smoke test – Arch
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/manzolodistro-arch:${{ steps.sha.outputs.tag }}"
          run() { docker run --rm "$IMAGE" "$@"; }

          echo "── Shell & CLI ──────────────────────────────"
          run zsh --version
          run fzf --version
          run rg --version
          run jq --version
          run yq --version

          echo "── Sviluppo ─────────────────────────────────"
          run git --version
          run git config --system --list | grep "alias.co"
          run gh --version
          run python --version
          run node --version

          echo "── Docker CLI ───────────────────────────────"
          run docker --version

          echo "── Desktop ──────────────────────────────────"
          run niri --version
          run fuzzel --version
          run brightnessctl --version
          run playerctl --version

          echo "── Media ────────────────────────────────────"
          run ffmpeg -version 2>&1 | head -1

          echo "✅ Smoke test Arch superato!"

      - name: Summary
        if: always()
        run: |
          echo "### 🧪 Smoke test – sha ${{ steps.sha.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu | \`${{ steps.sha.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Arch   | \`${{ steps.sha.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY

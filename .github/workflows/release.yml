name: Release – Build & Publish versioned OCI image

# Triggered only when a version tag (e.g. v0.1.0) is pushed.
# Publishes semver-tagged images to GHCR and creates a GitHub Release.
on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: variante Ubuntu ───────────────────────────────────
  release-ubuntu:
    name: Release Ubuntu image
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create the GitHub Release
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (Ubuntu)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/manzolodistro
          tags: |
            # v0.1.0  →  0.1.0
            type=semver,pattern={{version}}
            # v0.1.0  →  0.1
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (Ubuntu)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Riusa la cache del workflow build per non ricostruire da zero
          cache-from: type=gha,scope=ubuntu
          cache-to: type=gha,mode=max,scope=ubuntu
          platforms: linux/amd64,linux/arm64

      - name: Release summary (Ubuntu)
        run: |
          echo "### 🏷️ Ubuntu release pubblicata!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Immagini:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── Job 2: variante Arch Linux ───────────────────────────────
  release-arch:
    name: Release Arch Linux image
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (Arch)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/manzolodistro-arch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (Arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile.arch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arch
          cache-to: type=gha,mode=max,scope=arch
          platforms: linux/amd64

      - name: Release summary (Arch)
        run: |
          echo "### 🏷️ Arch Linux release pubblicata!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Immagini:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── Crea la GitHub Release ───────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-ubuntu, release-arch]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "ManzoloDistro ${{ github.ref_name }}"
          body: |
            ## 🐧 ManzoloDistro ${{ github.ref_name }}

            ### OCI images

            **Ubuntu:**
            ```bash
            docker pull ghcr.io/manzolo/manzolodistro:${{ github.ref_name }}
            ```

            **Arch Linux:**
            ```bash
            docker pull ghcr.io/manzolo/manzolodistro-arch:${{ github.ref_name }}
            ```

            ### Con Distrobox
            ```bash
            distrobox create --name manzolodistro --image ghcr.io/manzolo/manzolodistro:${{ github.ref_name }}
            distrobox enter manzolodistro
            ```
          generate_release_notes: true
